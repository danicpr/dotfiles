symbolPreset: nerd
theme:
  dark: titanium
  light: light
setupVersion: 2
debug:
  enabled: false
browser:
  enabled: false
tools:
  approvalMode: yolo
  approval:
    bash: allow
magicKeywords:
  enabled: false
  ultrathink: false
  orchestrate: false
  workflow: false
autoResume: true
defaultThinkingLevel: auto
includeModelInPrompt: true
personality: none
retry:
  modelFallback: false
  fallbackChains:
    image:
      - openrouter/google/gemini-3-pro-image
      - openai/gpt-image-2
      - openai-codex/gpt-image-2
      - xai/grok-imagine-image
      - xai-oauth/grok-imagine-image
      - google/gemini-3-pro-image
      - deepinfra/black-forest-labs/FLUX-2-pro
statusLine:
  separator: slash
  preset: default
  sessionAccent: true
  transparent: false
  showHookStatus: true
tui:
  textSizing: true
  tight: false
display:
  showTokenUsage: true
task:
  showResolvedModelBadge: true
  eager: preferred
  maxEffort: xhigh
  enableEffort: true
  agentModelOverrides:
    reviewer: vertex-global/gemini-4-argon
    scout: vertex-global/gemini-3.8-flash
    seance: vertex-global/gemini-3.8-flash
    sonic: vertex-global/gemini-3.8-flash
    task: vertex-global/gemini-3.8-flash
    security-reviewer: vertex-global/gemini-4-argon

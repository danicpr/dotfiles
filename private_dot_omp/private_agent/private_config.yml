plan:
  defaultOnStartup: false
commands:
  enableClaudeUser: false
  enableClaudeProject: false
  enableOpencodeUser: false
  enableOpencodeProject: false
providers:
  tinyModelDevice: gpu
  openrouterVariant: floor
provider:
  appendOnlyContext: auto
modelRoles:
  smol: vertex-global/gemini-3.8-flash:auto
  tiny: "local/lfm2.5-350m,deepseek/deepseek-v4-flash:off"
  slow: openrouter/meta/muse-spark-1.3-contributor:auto
  plan: vertex-global/gemini-4-argon:medium
  vision: openrouter/meta/muse-spark-1.3-contributor:auto
  image: google-antigravity/gemini-3-pro-image
  default: vertex-global/gemini-3.8-flash:high
  advisor: vertex-global/gemini-4-argon:medium
github:
  cache:
    enabled: false
temperature: 0.5
startup:
  quiet: true
read:
  renderMarkdown: true
textVerbosity: medium
composer:
  shape: pi
hideThinkingBlock: true
